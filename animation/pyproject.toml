[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duck_anim"
version = "0.1.0"
description = "Animation runtime library for the Open Duck Mini v2 robot (clip loading, playback, mixing, safety limiting)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["duck_anim*"]
